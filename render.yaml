# Render Blueprint — GitHub reposunu bu fayla bağlasan, deploy avtomatik qurulur.
# Render → New → Blueprint → repo seç.
services:
  - type: web
    name: namazov-game-center
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    headers:
      # Hashlanmış fayllar — bir il keşdə qala bilər.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # HTML həmişə yenidən yoxlanmalıdır ki, dəyişiklik dərhal görünsün.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
